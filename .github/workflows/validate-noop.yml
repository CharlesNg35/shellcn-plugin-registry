# Twin of validate.yml for PRs that touch none of its paths: same workflow and
# job names, so the required "validate" and "binaries-ok" statuses still report
# green on docs-only changes instead of blocking the merge forever.
name: Validate

on:
  pull_request:
    paths-ignore: ["plugins/**", "tools/**", ".github/workflows/**"]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No registry-relevant changes; nothing to validate."
  binaries-ok:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No registry-relevant changes; no binaries to execute."
