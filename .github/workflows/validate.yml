name: Validate

on:
  pull_request:
    paths: ["plugins/**", "tools/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  # Stage 1: cheap, always meaningful — schema for every manifest, full hash
  # verification of every asset, and the required linux/amd64 binary executed.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: tools/go.sum

      - name: Test tooling
        working-directory: tools
        run: |
          gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
          go vet ./...
          go test ./...

      - name: Build regctl
        run: go -C tools build -o "$RUNNER_TEMP/regctl" ./cmd/regctl

      - name: Validate all manifests
        run: '"$RUNNER_TEMP/regctl" validate'

      - name: Verify and execute changed manifests (linux/amd64)
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'plugins/*.yaml')
          [ -z "$changed" ] && { echo "no manifest changes"; exit 0; }
          for f in $changed; do
            [ -f "$f" ] || continue   # deleted manifest
            # Hash-verify every asset of every version, all platforms.
            "$RUNNER_TEMP/regctl" verify "$f"
            # Execute the required platform's binary: handshake, gateway-grade
            # manifest validation, name/version/SDK identity pinning.
            "$RUNNER_TEMP/regctl" check "$f" -platform linux/amd64
          done

  # Stage 2: every other platform a manifest actually ships gets its binary
  # executed natively on a matching runner; absent platforms skip cleanly. This
  # guarantees no invalid binary of any platform reaches the index.
  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            os: ubuntu-24.04-arm
          - platform: darwin/arm64
            os: macos-latest
          - platform: darwin/amd64
            os: macos-latest # Apple Silicon runner executes amd64 via Rosetta
          - platform: windows/amd64
            os: windows-latest
          - platform: windows/arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: tools/go.sum

      - name: Build regctl
        shell: bash
        run: go -C tools build -o "$RUNNER_TEMP/regctl" ./cmd/regctl

      - name: Execute provided ${{ matrix.platform }} binaries
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'plugins/*.yaml')
          [ -z "$changed" ] && { echo "no manifest changes"; exit 0; }
          for f in $changed; do
            [ -f "$f" ] || continue
            "$RUNNER_TEMP/regctl" check "$f" -platform "${{ matrix.platform }}"
          done

  # Single aggregate status so branch protection needs just "validate" and
  # "binaries-ok" while still covering every matrix leg.
  binaries-ok:
    needs: [validate, binaries]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          [ "${{ needs.validate.result }}" = "success" ] || exit 1
          [ "${{ needs.binaries.result }}" = "success" ] || exit 1
